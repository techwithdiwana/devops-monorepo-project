replicaCount: 2

image:
  repository: techwithdiwana/auth-service
  tag: 3
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8000

config:
  dbHost: mysql-service.helm-mysql-test.svc.cluster.local
  dbPort: "3306"
  dbName: devopsdb
  logLevel: INFO

secret:
  dbUser: root
  dbPassword: Root@123

resources:
  requests:
    cpu: 100m
    memory: 128Mi

  limits:
    cpu: 500m
    memory: 256Mi

serviceAccount:
  create: false
  automount: false
  annotations: {}
  name: ""

autoscaling:
  enabled: false

livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3