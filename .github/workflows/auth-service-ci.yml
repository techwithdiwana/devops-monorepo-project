name: Auth Service CI

on:
  push:
    branches:
      - develop

    paths:
      - 'auth-service/**'

  workflow_dispatch:

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: auth-service

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Verify Python
        run: |
          python --version

  test:

    runs-on: ubuntu-latest

    needs: build

    defaults:
      run:
        working-directory: auth-service

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run Unit Tests
        run: |
          pytest -v

  trivy:

    runs-on: ubuntu-latest

    needs: test

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .

  docker:

    runs-on: ubuntu-latest

    needs: trivy

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Login To DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Image
        run: |
          docker build \
          -t techwithdiwana/auth-service:${{ github.run_number }} \
          ./auth-service

      - name: Push Image
        run: |
          docker push \
          techwithdiwana/auth-service:${{ github.run_number }}

  update-helm:

    runs-on: ubuntu-latest

    needs: docker

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Update Image Tag
        run: |
          sed -i "s/tag:.*/tag: ${GITHUB_RUN_NUMBER}/" \
          helm/auth-service/values.yaml

      - name: Commit Changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add helm/auth-service/values.yaml

          git commit -m "Update auth-service image tag to ${GITHUB_RUN_NUMBER}" || echo "No Changes"

          git push origin develop