name: Auth Service CI

on:
  push:
    branches:
      - develop
    paths:
      - auth-service/**

  workflow_dispatch:

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: auth-service

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install -r requirements.txt

      - name: Check python
        run: python --version

  test:

    runs-on: ubuntu-latest
    needs: build

    defaults:
      run:
        working-directory: auth-service

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -v

  security-scan:

    runs-on: ubuntu-latest
    needs: test

    steps:

      - uses: actions/checkout@v4

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .

  docker-build:

    runs-on: ubuntu-latest
    needs: security-scan

    steps:

      - uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build image
        run: |
          docker build \
          -t techwithdiwana/auth-service:${{ github.run_number }} \
          ./auth-service

      - name: Push image
        run: |
          docker push \
          techwithdiwana/auth-service:${{ github.run_number }}

  update-helm:

    runs-on: ubuntu-latest
    needs: docker-build

    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update image tag
        run: |
          sed -i "s/tag:.*/tag: ${{ github.run_number }}/" \
          helm/auth-service/values.yaml

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add helm/auth-service/values.yaml

          git diff --cached --quiet || \
          git commit -m "Update auth-service image tag to ${{ github.run_number }}"

      - name: Push changes
        run: |
          git pull --rebase origin develop

          git push origin develop