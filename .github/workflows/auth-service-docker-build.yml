name: Auth Service Docker Build

on:

  workflow_dispatch:

  push:
    branches:
      - develop

    paths:
      - 'auth-service/**'

jobs:

  docker-build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify Docker
        run: docker --version

      - name: Build Docker Image
        run: |
          docker build \
          -t auth-service:latest \
          ./auth-service

      - name: Verify Docker Image
        run: |
          docker images