name: API Gateway CI

on:
  push:
    branches:
      - develop
    paths:
      - "api-gateway/**"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  prepare:
    name: Prepare Environment
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api-gateway

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: api-gateway/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Verify Node Version
        run: |
          node --version
          npm --version

  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    needs: prepare

    defaults:
      run:
        working-directory: api-gateway

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: api-gateway/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    defaults:
      run:
        working-directory: api-gateway

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: api-gateway/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

    trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0
        with:
          scan-type: fs
          scan-ref: ./api-gateway
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  docker:
    name: Build, Scan & Push Docker Image
    runs-on: ubuntu-latest
    needs: trivy-fs

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login To DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t techwithdiwana/api-gateway:${{ github.run_number }} \
            -t techwithdiwana/api-gateway:latest \
            ./api-gateway

      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@v0
        with:
          image-ref: techwithdiwana/api-gateway:${{ github.run_number }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Push Docker Images
        run: |
          docker push techwithdiwana/api-gateway:${{ github.run_number }}
          docker push techwithdiwana/api-gateway:latest

  update-helm:
    name: Update Helm Chart
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Image Tag
        run: |
          sed -i "s/tag:.*/tag: ${GITHUB_RUN_NUMBER}/" helm/api-gateway/values.yaml

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Pull Latest Changes
        run: |
          git pull --rebase origin develop

      - name: Commit Changes
        run: |
          git add helm/api-gateway/values.yaml
          git commit -m "ci: update api-gateway image to ${GITHUB_RUN_NUMBER}" || echo "Nothing to commit"

      - name: Push Changes
        run: |
          git push origin develop